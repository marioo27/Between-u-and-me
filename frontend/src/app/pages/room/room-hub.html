<main class="room">
  <header class="room__bar">
    <div class="container room__bar-inner">
      <a class="room__back" routerLink="/">Between U &amp; Me</a>
      <h1 class="display room__title">{{ t().roomTitle }}</h1>
      <app-site-menu />
    </div>
  </header>

  <section class="container room__panel">
    @if (waking()) {
      <p class="room__status" role="status">{{ t().roomWaking }}</p>
    }
    @if (error()) {
      <p class="room__error" role="alert">{{ error() }}</p>
    }

    <h2 class="room__heading">{{ t().roomCreate }}</h2>
    <div class="room__actions">
      <button type="button" class="die" [disabled]="busy()" (click)="create('nhie')">
        {{ t().homeNhieTitle }}
      </button>
      <button type="button" class="die" [disabled]="busy()" (click)="create('impostor')">
        {{ t().homeImpostorTitle }}
      </button>
      <button type="button" class="die" [disabled]="busy()" (click)="create('whoami')">
        {{ t().homeWhoamiTitle }}
      </button>
    </div>

    <h2 class="room__heading">{{ t().roomJoin }}</h2>
    <div class="room__join">
      <input
        class="room__input"
        type="text"
        maxlength="6"
        [value]="joinCode()"
        [attr.placeholder]="t().roomCodePlaceholder"
        (input)="joinCode.set($any($event.target).value.toUpperCase())"
        (keydown.enter)="$event.preventDefault(); join()"
      />
      <button type="button" class="die" [disabled]="busy()" (click)="join()">
        {{ t().roomJoinCta }}
      </button>
    </div>
  </section>
</main>
